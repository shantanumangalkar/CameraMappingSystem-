# ==============================================================================
# Render Blueprint Specification (render.yaml)
# Police Camera Mapping & Geospatial Surveillance System
# Zero secrets exposed: credentials are generated or referenced from managed DB
# ==============================================================================

databases:
  # ----------------------------------------------------------------------------
  # 1. Managed PostgreSQL Database (PostGIS auto-enabled on boot)
  # ----------------------------------------------------------------------------
  - name: cameramapping-db
    databaseName: cameramapping
    user: postgres
    plan: free
    region: oregon

services:
  # ----------------------------------------------------------------------------
  # 2. Backend Web Service (Spring Boot 3 + Java 21)
  # ----------------------------------------------------------------------------
  - type: web
    name: cameramapping-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/auth/login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: cameramapping-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: update
      - key: APP_SEEDER_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://cameramapping-web.onrender.com,http://localhost:3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: camera-media

  # ----------------------------------------------------------------------------
  # 3. Frontend Static Site (React + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: cameramapping-web
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # React Router SPA catch-all rewrite to prevent 404 on refresh
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://cameramapping-api.onrender.com/api/v1
