server:
  port: ${PORT:${SERVER_PORT:8088}}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: police-camera-mapping-system

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/cameramapping}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Application Custom Security & Storage Config
app:
  jwt:
    secret: ${JWT_SECRET:8f7b2c9e1d4a6f3b5e8c2a1d4f7e9b3c5a8d2f1e4b7c9a3d6e8f1b4a7c2d5e8f}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  supabase:
    url: ${SUPABASE_URL:}
    key: ${SUPABASE_KEY:}
    bucket: ${SUPABASE_BUCKET:camera-media}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  seeder:
    enabled: ${APP_SEEDER_ENABLED:true}

# OpenAPI Documentation (disabled in prod via profile)
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operationsSorter: method
